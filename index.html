<body>
<header class="reviewbar"><div class="review-title"><span class="version">07</span><div><strong>Fioboc 会员与积分</strong><span class="small" style="margin-left:12px;color:#b2baa9">商品详情、购物车与结账页 · 2026.10.14</span></div></div><nav class="reviewnav" aria-label="评审角色"><button data-role="customer" class="active">账户会员页</button><button data-action="product-open" aria-pressed="false">官网商品详情页</button><button data-role="storefront">官网购物车</button><button data-action="checkout-open" aria-pressed="false">官网结账页</button></nav></header>
<div class="tools"><div class="row wrap"><label for="scenario">演示场景</label><select id="scenario"><option value="vip2">VIP2 · 标准账户</option><option value="member">Member · 待升级</option><option value="vip1">VIP1 · 标准账户</option><option value="vip3">VIP3 · 最高等级</option><option value="new">新客 · 尚未加入</option><option value="low">积分不足 · 120 分</option><option value="downgrade">退款降级 · VIP2 $540</option><option value="expiry">即将到期 / 过期券</option><option value="sync">同步失败</option><option value="storecoupon">优惠券 · 已兑换 $5 券</option><option value="rolling">滚动周期 · 消费即将移出</option></select><span class="hint muted">仅使用虚构数据，操作不会影响真实店铺</span></div><div class="row"><button id="advance">推进 30 天</button><button id="reset">重置演示</button><button id="desktop" class="active" aria-pressed="true">桌面</button><button id="mobile" aria-pressed="false">手机</button></div></div>
<div id="stage" class="stage"></div><div id="modalhost"></div><div id="toasthost" aria-live="polite"></div>
<script src="./assets/app.js" defer></script>

</html>
