<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIOBOC 会员积分原型 · 会员中心、Rewards 与官网购物流程</title>
<link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
<header class="reviewbar"><div class="review-title"><span class="version">07</span><div><strong>Fioboc 会员与积分</strong><span class="small" style="margin-left:12px;color:#b2baa9">会员中心、Rewards 与官网购物流程 · 2026.10.15</span></div></div><button type="button" id="review-changes-toggle" class="review-changes-toggle" aria-pressed="false" aria-controls="review-changes-summary">查看需调整区域</button></header>
<div class="tools"><div class="row wrap"><label for="scenario">演示场景</label><select id="scenario"><option value="vip2">VIP2 · 标准账户</option><option value="member">Member · 待升级</option><option value="vip1">VIP1 · 标准账户</option><option value="vip3">VIP3 · 最高等级</option><option value="new">新客 · 尚未加入</option><option value="low">积分不足 · 120 分</option><option value="downgrade">退款降级 · VIP2 $540</option><option value="expiry">即将到期 / 过期券</option><option value="storecoupon">优惠券 · 已兑换 $5 券</option></select><span class="hint muted">仅使用虚构数据，操作不会影响真实店铺</span></div><nav class="reviewnav" aria-label="原型页面"><button data-action="auth-open" data-id="auth" aria-pressed="false">注册 / 登录</button><button data-action="rewards-guide-open" aria-pressed="false">Rewards 制度介绍</button><button data-role="storefront">官网购物车</button><button data-action="checkout-open" aria-pressed="false">官网结账页</button><button data-role="customer" class="active">账户会员页</button></nav><div class="row"><button id="advance">推进 30 天</button><button id="reset">重置演示</button><button id="desktop" class="active" aria-pressed="true">桌面</button><button id="mobile" aria-pressed="false">手机</button></div></div>
<div id="stage" class="stage"></div><div id="modalhost"></div><div id="toasthost" aria-live="polite"></div>
<script src="./assets/app.js" defer></script>
</body>
</html>
